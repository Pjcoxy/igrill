<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iGrill has moved</title>
<link rel="canonical" href="https://red-sea-0036d7f00.7.azurestaticapps.net/">
<meta name="robots" content="noindex">
<!-- Belt and braces: the redirect fires immediately in JS, and the meta
     refresh covers the case where scripts are blocked. The visible link is
     there because a page that silently bounces you is unnerving. -->
<meta http-equiv="refresh" content="3; url=https://red-sea-0036d7f00.7.azurestaticapps.net/">
<style>
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; text-align: center;
    background: radial-gradient(120% 80% at 50% -10%, #241610 0%, transparent 60%) #0c0a08;
    color: #f5efe8;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  img { width: 96px; height: 96px; border-radius: 26px; margin-bottom: 22px; }
  h1 { font-size: 1.3rem; font-weight: 650; letter-spacing: -.02em; margin: 0 0 10px; }
  p { color: #9a8f84; font-size: .92rem; line-height: 1.55; margin: 0 0 24px; max-width: 30rem; }
  a.go {
    display: inline-block; text-decoration: none; font-weight: 650;
    background: linear-gradient(160deg, #ffab3d, #ff6a1a); color: #241004;
    padding: 13px 26px; border-radius: 13px;
    box-shadow: 0 10px 26px -12px #ff6a1a;
  }
  small { display: block; margin-top: 26px; color: #6b6259; font-size: .76rem; }
  small a { color: #9a8f84; }
</style>
</head>
<body>
  <main>
    <img src="icon-512.png" alt="">
    <h1>The iGrill dashboard has moved</h1>
    <p>Bluetooth and the remote view are now one page, behind a Microsoft sign-in.
       Taking you there now.</p>
    <a class="go" href="https://red-sea-0036d7f00.7.azurestaticapps.net/">Open the dashboard</a>
    <small>Bookmarked this page? Update it.
      The old Bluetooth-only version is still <a href="old-dashboard.html">here</a>.</small>
  </main>
<script>
  // Clear the old service worker first, or it will keep serving the old app
  // from cache to anyone who installed it.
  (async () => {
    try {
      if ("serviceWorker" in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      }
      if (window.caches) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
      }
    } catch (e) { /* redirect regardless */ }
    location.replace("https://red-sea-0036d7f00.7.azurestaticapps.net/");
  })();
</script>
</body>
</html>
